<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Yassin Bahri — Python developer building agent infrastructure and open-source tools</title>
  <desc id="desc">Dark green and blue banner with connected mesh nodes and a database representing safe reuse, traceable data pipelines, and predictable backends.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b14"/>
      <stop offset="0.52" stop-color="#0c4b33"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#44b78b" stop-opacity=".28"/>
      <stop offset="1" stop-color="#44b78b" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#background)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <circle cx="1030" cy="115" r="230" fill="url(#glow)"/>
  <circle cx="95" cy="270" r="180" fill="url(#glow)" opacity=".55"/>

  <g opacity=".45" stroke="#44b78b" stroke-width="2">
    <path d="M885 74L992 117L919 207M992 117L1094 73M992 117L1090 203"/>
  </g>
  <g fill="#44b78b" filter="url(#softGlow)">
    <circle cx="885" cy="74" r="6"/>
    <circle cx="919" cy="207" r="6"/>
    <circle cx="1094" cy="73" r="6"/>
    <circle cx="1090" cy="203" r="6"/>
  </g>

  <g transform="translate(949 83)">
    <ellipse cx="43" cy="18" rx="48" ry="18" fill="#102f25" stroke="#7ee2bb" stroke-width="3"/>
    <path d="M-5 18v68c0 10 21 18 48 18s48-8 48-18V18" fill="#102f25" stroke="#7ee2bb" stroke-width="3"/>
    <path d="M-5 51c0 10 21 18 48 18s48-8 48-18M-5 84c0 10 21 18 48 18s48-8 48-18" fill="none" stroke="#7ee2bb" stroke-width="3" opacity=".75"/>
  </g>

  <text x="72" y="116" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="53" font-weight="700" letter-spacing="-.8">Yassin Bahri</text>
  <text x="74" y="164" fill="#9de6c9" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="500">PYTHON · AI AGENTS · DJANGO · OPEN SOURCE</text>
  <rect x="73" y="190" width="548" height="1" fill="#ffffff" opacity=".16"/>
  <text x="74" y="231" fill="#d6eee5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19">Building safe reuse layers, traceable data pipelines, and predictable backends.</text>
</svg>
